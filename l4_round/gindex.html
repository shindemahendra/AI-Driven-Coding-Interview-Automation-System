<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>L4 Coding — Gemini API IDE</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/theme/dracula.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/go/go.min.js"></script>

<style>
:root{
  --bg:#282a36;
  --bg-light:#44475a;
  --fg:#f8f8f2;
  --green:#50fa7b;
  --red:#ff5555;
  --yellow:#f1fa8c;
}
body, html{
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: sans-serif;
  color: var(--fg);
  background-color: var(--bg);
  display: flex;
  flex-direction: column;
}
header{
  background-color: var(--bg-light);
  padding: 10px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
header h1{
  margin: 0;
  font-size: 1.5em;
}
.main-container{
  display: flex;
  flex-grow: 1;
}
.sidebar{
  width: 30%;
  min-width: 300px;
  background-color: var(--bg-light);
  overflow-y: auto;
  padding: 20px;
  box-sizing: border-box;
  border-right: 1px solid var(--bg-light);
}
.content{
  width: 70%;
  display: flex;
  flex-direction: column;
}
.editor-container{
  flex-grow: 1;
  overflow: hidden;
}
.CodeMirror {
  height: 100%;
  font-size: 14px;
}
.tabs {
  display: flex;
  background-color: var(--bg-light);
}
.tab-button {
  padding: 10px 15px;
  cursor: pointer;
  background-color: var(--bg);
  border: none;
  border-right: 1px solid var(--bg-light);
  color: var(--fg);
}
.tab-button.active {
  background-color: var(--bg-light);
  font-weight: bold;
}
#description, #output {
  padding: 15px;
  white-space: pre-wrap;
  background-color: var(--bg-light);
  border-top: 1px solid var(--bg);
  max-height: 250px;
  overflow-y: auto;
}
#output {
  min-height: 100px;
  border-top: 5px solid var(--bg);
}
.run-submit{
  display: flex;
  padding: 10px;
  background-color: var(--bg-light);
  border-top: 1px solid var(--bg);
  gap: 10px;
}
button {
  padding: 10px 20px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
}
#runButton {
  background-color: var(--green);
  color: var(--bg);
}
#submitButton {
  background-color: var(--yellow);
  color: var(--bg);
}
#scoreBox{
  background-color: var(--bg);
  color: var(--green);
  padding: 10px 20px;
  border-radius: 5px;
  margin-left: auto;
  font-weight: bold;
}
select{
  padding: 5px;
  border-radius: 3px;
  background-color: var(--bg);
  color: var(--fg);
  border: 1px solid var(--bg-light);
}
</style>
</head>
<body>

<header>
  <h1>L4 Coding IDE (Python/Gemini)</h1>
  <select id="languageSelect">
    <option value="python">Python 3</option>
    <option value="javascript" disabled>JavaScript (Disabled)</option>
    <option value="cpp" disabled>C++ (Disabled)</option>
    </select>
</header>

<div class="main-container">

  <div class="sidebar">
    <h3 id="problemTitle">Loading Problem...</h3>
    <div id="description">Problem description will appear here.</div>
  </div>

  <div class="content">
    <div class="editor-container">
      <div id="editor"></div>
    </div>

    <div class="tabs" id="tabsContainer">
      <button class="tab-button active" id="tab0" data-index="0">Problem 1</button>
    </div>

    <div class="run-submit">
      <button id="runButton">Run Code (Public Tests)</button>
      <button id="submitButton">Submit (Hidden Tests)</button>
      <div id="scoreBox">Ready</div>
    </div>

    <div id="output">Execution output will appear here.</div>

  </div>

</div>

<script src="gproblems.js"></script>
<script src="gscript.js"></script>

</body>
</html>
